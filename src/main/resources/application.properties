spring.application.name=mascotas-rest
server.servlet.context-path=/api/v1
server.port=8085

# -------------------------------------------------------------------
# Base de datos (modificar usuario/clave según tu SQL Server)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:mascotas_cba};encrypt=false
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Test123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# -------------------------------------------------------------------
# Seguridad
#  - api-key: identifica a la aplicación cliente (header X-API-Key)
#  - jwt.secret: clave HMAC-SHA256 en Base64 (mínimo 32 bytes)
#  - jwt.expiration-minutes: duración de la sesión del usuario
# Los valores por defecto son solo para desarrollo local.
# -------------------------------------------------------------------
security.api-key=${API_KEY:XmPQoUJivapBninskBOy-g39f5xV-9oMEYGJ}
security.jwt.secret=${JWT_SECRET:qWrg15AAgDuyjRSnIUu34Zybe1O1PGrXhO35jWKTl2o=}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Origen permitido para CORS (Angular en desarrollo)
cors.allowed-origin=${CORS_ORIGIN:http://localhost:4200}

# Tamaño máximo de la foto de una publicación (bytes): 2 MB
publicaciones.foto.max-bytes=2097152
